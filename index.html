<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Face Attendance System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
  <style>.glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }</style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col justify-between">

  <header class="bg-indigo-700 text-white p-4 shadow-md text-center font-bold text-lg flex justify-between items-center">
    <span>AI Attendance Hub</span>
    <button id="logoutBtn" onclick="logout()" class="hidden text-xs bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-lg shadow transition">Logout</button>
  </header>

  <main class="container mx-auto p-4 max-w-md flex-1">

    <!-- ROLE SELECTOR -->
    <div id="roleView" class="glass p-6 rounded-2xl shadow-xl mt-8 text-center space-y-4">
      <h2 class="text-xl font-bold text-indigo-900">Select Portal</h2>
      <button onclick="showRegistration()" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-semibold rounded-xl shadow-md transition">Employee Self Registration</button>
      <button onclick="showEmpLogin()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-md transition">Mark Face Attendance</button>
      <button onclick="showAdminLogin()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md transition">Admin / Requests Portal</button>
    </div>

    <!-- REGISTRATION VIEW -->
    <div id="registrationView" class="hidden glass p-6 rounded-2xl shadow-xl mt-4 space-y-4">
      <h2 class="text-xl font-bold text-amber-700">Self Registration</h2>
      <div class="flex gap-2">
        <input type="text" id="regCfmsId" placeholder="Enter CFMS ID" class="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-amber-400">
        <button id="btnFindCfms" onclick="fetchEmpData(event)" class="bg-amber-500 text-white px-4 rounded-lg font-bold">Fetch</button>
      </div>

      <div id="regDetails" class="hidden space-y-2 text-sm mt-2 border-t pt-4">
        <input type="text" id="r_candName" readonly class="w-full p-2 bg-slate-100 rounded border" placeholder="Candidate Name">
        <input type="text" id="r_secName" readonly class="w-full p-2 bg-slate-100 rounded border" placeholder="Secretariat Name">
        <input type="text" id="r_phone" readonly class="w-full p-2 bg-slate-100 rounded border" placeholder="Phone No">
        
        <input type="email" id="r_email" placeholder="Your Active Email ID (Required for Password Resets)" class="w-full p-2 border border-blue-400 rounded-lg mt-2 focus:ring-2 focus:ring-blue-500">
        <input type="password" id="r_password" placeholder="Create your custom Login Password" class="w-full p-2 border border-amber-400 rounded-lg focus:ring-2 focus:ring-amber-500">
        
        <div class="relative w-full aspect-square bg-black rounded-xl overflow-hidden mt-2 flex items-center justify-center">
          <video id="regWebcam" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
          <div id="regPrompt" class="absolute bottom-2 bg-black/70 text-white text-xs px-2 py-1 rounded font-semibold text-center">Align face for Registration</div>
        </div>
        <button onclick="registerWithFace(event)" class="w-full py-3 bg-amber-600 text-white font-bold rounded-xl mt-2 shadow transition">Capture Face & Register</button>
      </div>
      <button onclick="showHome()" class="w-full text-slate-500 text-sm font-medium mt-2">Cancel & Back</button>
    </div>

    <!-- ADMIN LOGIN VIEW -->
    <div id="adminLoginView" class="hidden glass p-6 rounded-2xl shadow-xl mt-4 space-y-4">
      <h2 class="text-xl font-bold text-indigo-900">Admin Authentication</h2>
      <input type="text" id="adminUser" placeholder="Username (Default: RMC_Main)" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-400">
      <input type="password" id="adminPass" placeholder="Password" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-400">
      <button onclick="loginAdmin()" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow">Login</button>
      <button onclick="resetPassword('ADMIN')" class="w-full text-blue-500 text-xs mt-1">Forgot Admin Password?</button>
      <button onclick="showHome()" class="w-full text-slate-500 text-sm font-medium">Back</button>
    </div>

    <!-- ADMIN DASHBOARD (TABS) -->
    <div id="adminDashboardView" class="hidden space-y-4 mt-4">
      <div class="flex flex-wrap gap-2 text-xs">
        <button onclick="switchTab('tabSettings')" class="bg-indigo-600 text-white px-3 py-2 rounded shadow">Control</button>
        <button onclick="switchTab('tabPunch')" class="bg-slate-200 px-3 py-2 rounded shadow">Manual Punch</button>
        <button onclick="switchTab('tabRequests')" class="bg-slate-200 px-3 py-2 rounded shadow">Requests</button>
        <button id="btnSubAdminTab" onclick="switchTab('tabSubAdmin')" class="bg-slate-200 px-3 py-2 rounded shadow hidden">Sub-Admins</button>
      </div>

      <!-- Tab: Settings -->
      <div id="tabSettings" class="glass p-5 rounded-2xl shadow space-y-3">
        <h3 class="font-bold text-indigo-900 border-b pb-2">Attendance Time Control</h3>
        <label class="flex items-center gap-2 font-semibold text-sm">
          <input type="checkbox" id="set_active" class="w-4 h-4"> Allow System Punches
        </label>
        <div class="grid grid-cols-2 gap-2 text-sm mt-2">
          <div><label>IN Start</label><input type="time" id="set_in_start" class="w-full p-2 border rounded"></div>
          <div><label>IN End</label><input type="time" id="set_in_end" class="w-full p-2 border rounded"></div>
          <div><label>OUT Start</label><input type="time" id="set_out_start" class="w-full p-2 border rounded"></div>
          <div><label>OUT End</label><input type="time" id="set_out_end" class="w-full p-2 border rounded"></div>
        </div>
        <button onclick="saveAdminSettings()" class="w-full py-2 bg-indigo-600 text-white font-semibold rounded-lg mt-2">Save Rules</button>
      </div>

      <!-- Tab: Manual Punch -->
      <div id="tabPunch" class="glass p-5 rounded-2xl shadow space-y-3 hidden">
        <h3 class="font-bold text-indigo-900 border-b pb-2">Direct Manual Punch</h3>
        <input type="text" id="manCfms" placeholder="Employee CFMS ID" class="w-full p-2 border rounded">
        <input type="text" id="manName" placeholder="Employee Name" class="w-full p-2 border rounded">
        <input type="text" id="manSec" placeholder="Secretariat" class="w-full p-2 border rounded">
        <div class="flex gap-2 mt-2">
          <button onclick="adminPunch('IN')" class="w-full py-2 bg-emerald-600 text-white font-bold rounded">Force IN</button>
          <button onclick="adminPunch('OUT')" class="w-full py-2 bg-red-600 text-white font-bold rounded">Force OUT</button>
        </div>
      </div>

      <!-- Tab: Requests & Edits -->
      <div id="tabRequests" class="glass p-5 rounded-2xl shadow space-y-3 hidden">
        <h3 class="font-bold text-indigo-900 border-b pb-2">Employee DB Edits</h3>
        <button onclick="loadRequests()" class="w-full py-1 bg-slate-200 text-xs rounded mb-2">Refresh</button>
        <div id="requestsContainer" class="space-y-3 max-h-64 overflow-y-auto text-sm"></div>
      </div>

      <!-- Tab: Sub-Admins -->
      <div id="tabSubAdmin" class="glass p-5 rounded-2xl shadow space-y-3 hidden">
        <h3 class="font-bold text-indigo-900 border-b pb-2">Create Sub-Admin</h3>
        <input type="text" id="subUser" placeholder="Username" class="w-full p-2 border rounded">
        <input type="password" id="subPass" placeholder="Password" class="w-full p-2 border rounded">
        <input type="email" id="subEmail" placeholder="Email (For Resets)" class="w-full p-2 border rounded">
        <button onclick="createSubAdmin()" class="w-full py-2 bg-indigo-600 text-white font-semibold rounded-lg mt-2">Add Sub-Admin</button>
      </div>
    </div>

    <!-- EMPLOYEE ATTENDANCE VIEW -->
    <div id="empLoginView" class="hidden glass p-6 rounded-2xl shadow-xl mt-4 space-y-4">
      <h2 class="text-xl font-bold text-emerald-900">Employee Portal</h2>
      <input type="text" id="empCfms" placeholder="CFMS ID" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-400">
      <input type="password" id="empPass" placeholder="Password" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-400">
      <button onclick="loginEmployee()" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl shadow">Login to Punch</button>
      <button onclick="resetPassword('EMP')" class="w-full text-blue-500 text-xs mt-1">Forgot Password?</button>
      <button onclick="showHome()" class="w-full text-slate-500 text-sm font-medium">Back</button>
    </div>

    <div id="empCaptureView" class="hidden space-y-4">
      <div class="glass p-4 rounded-2xl shadow text-center space-y-2">
        <h3 id="empWelcome" class="font-bold text-lg text-emerald-900"></h3>
      </div>
      <div class="relative w-full aspect-square bg-black rounded-2xl overflow-hidden shadow-2xl flex items-center justify-center">
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
        <div id="aiPrompt" class="absolute bottom-3 bg-black/75 text-white text-xs px-3 py-1.5 rounded-full font-semibold">Initializing AI...</div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button id="btnIn" onclick="punchAttendance('IN')" disabled class="py-3 bg-emerald-600 disabled:bg-slate-400 text-white font-bold rounded-xl shadow">Punch IN</button>
        <button id="btnOut" onclick="punchAttendance('OUT')" disabled class="py-3 bg-red-600 disabled:bg-slate-400 text-white font-bold rounded-xl shadow">Punch OUT</button>
      </div>
    </div>

  </main>

  <script>
    // ⚠️ UPDATE THIS LINK ⚠️
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQlzUKPlRoeq30oDoBjYZW_8d_y6oDM_6bNTFNrYhoIfVg-mUVO0duAACy_K9Cfruv/exec";

    let currentUser = null, cameraInstance = null, modelsLoaded = false, livenessVerified = false, capturedPhotoBase64 = null;

    async function initFaceAPI() {
      if (modelsLoaded) return;
      const prompt = document.getElementById('aiPrompt');
      if (prompt) prompt.innerText = "Downloading Face Models...";
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      try {
        await Promise.all([
          faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);
        modelsLoaded = true;
      } catch (err) { alert("Error loading AI models."); }
    }

    function hideAll() {
      ['roleView','registrationView','adminLoginView','adminDashboardView','empLoginView','empCaptureView'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById('logoutBtn').classList.add('hidden');
    }

    function showHome() { hideAll(); document.getElementById('roleView').classList.remove('hidden'); stopCameras(); if (document.getElementById('btnFindCfms').disabled) window.location.reload(); }
    function showAdminLogin() { hideAll(); document.getElementById('adminLoginView').classList.remove('hidden'); }
    function showEmpLogin() { hideAll(); document.getElementById('empLoginView').classList.remove('hidden'); initFaceAPI(); }
    function showRegistration() { hideAll(); document.getElementById('registrationView').classList.remove('hidden'); initFaceAPI(); }
    function logout() { currentUser = null; stopCameras(); showHome(); }

    function stopCameras() {
      if (cameraInstance) { cameraInstance.stop(); cameraInstance = null; }
      ['regWebcam', 'webcam'].forEach(id => {
        const vid = document.getElementById(id);
        if (vid && vid.srcObject) { vid.srcObject.getTracks().forEach(t => t.stop()); vid.srcObject = null; }
      });
    }

    async function fetchEmpData(event) {
      const cfmsInput = document.getElementById('regCfmsId');
      const cfmsId = cfmsInput.value.trim();
      if (!cfmsId) return alert("Please enter your CFMS ID.");
      const btn = event.target; const txt = btn.innerText; btn.innerText = "Connecting..."; btn.disabled = true;

      stopCameras();
      let stream = null;
      try { stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); } catch (err) {}

      try {
        const response = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "fetch_emp_data", cfmsId: cfmsId }), redirect: "follow" });
        const res = await response.json();
        if (res.success) {
          cfmsInput.disabled = true; btn.innerText = "Locked";
          document.getElementById('regDetails').classList.remove('hidden');
          document.getElementById('r_candName').value = res.data.candidateName;
          document.getElementById('r_secName').value = res.data.secName;
          document.getElementById('r_phone').value = res.data.phone;
          if (stream) document.getElementById('regWebcam').srcObject = stream;
        } else {
          if (stream) stopCameras(); btn.innerText = txt; btn.disabled = false; alert(res.message);
        }
      } catch (error) { btn.innerText = txt; btn.disabled = false; alert("Error: " + error.message); }
    }

    async function registerWithFace(event) {
      const btn = event.target; const originalText = btn.innerText;
      const video = document.getElementById('regWebcam');
      const pass = document.getElementById('r_password').value.trim();
      const email = document.getElementById('r_email').value.trim();
      
      if (!email || !pass) return alert("❌ Email and Password are required.");
      if (pass.length < 4) return alert("❌ Password must be at least 4 characters long.");
      if (!video.srcObject) return alert("❌ Camera not active.");
      
      btn.innerText = "Analyzing Face Rules..."; btn.disabled = true;
      
      try {
        const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
        if (detections.length === 0) throw new Error("❌ Human face not detected! Look directly at camera.");
        if (detections.length > 1) throw new Error("❌ Multiple faces detected! Only 1 person allowed.");
        if (detections[0].detection.score < 0.90) throw new Error("❌ Face obscured. Remove masks, heavy glasses, or caps."); // Strict Score
        
        const payload = { action: "self_register", secName: document.getElementById('r_secName').value, candidateName: document.getElementById('r_candName').value, cfmsId: document.getElementById('regCfmsId').value.trim(), phone: document.getElementById('r_phone').value, email: email, password: pass, faceDescriptor: Array.from(detections[0].descriptor) };
        const response = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload), redirect: "follow" });
        const res = await response.json();
        if (res.success) { alert(`🎉 Registration Successful!\nRedirecting to Home.`); showHome(); } else alert(res.message);
      } catch (e) { alert(e.message); } finally { btn.innerText = originalText; btn.disabled = false; }
    }

    // --- PASSWORD RESET ---
    async function resetPassword(type) {
      const identifier = prompt(`Enter your ${type === 'ADMIN' ? 'Username' : 'CFMS ID'} to receive a new password via email:`);
      if (!identifier) return;
      alert("Requesting reset... please wait.");
      try {
        const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "reset_password", type: type, identifier: identifier }) }).then(r=>r.json());
        alert(res.message);
      } catch(e) { alert("Reset Error."); }
    }

    // --- ADMIN LOGIC ---
    function switchTab(tabId) {
      ['tabSettings','tabPunch','tabRequests','tabSubAdmin'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById(tabId).classList.remove('hidden');
    }

    async function loginAdmin() {
      const u = document.getElementById('adminUser').value, p = document.getElementById('adminPass').value;
      try {
        const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "admin_login", username: u, password: p }) }).then(r=>r.json());
        if (res.success) { 
          hideAll(); document.getElementById('adminDashboardView').classList.remove('hidden'); document.getElementById('logoutBtn').classList.remove('hidden');
          if (res.role === "MAIN") document.getElementById('btnSubAdminTab').classList.remove('hidden');
          loadAdminSettings(); loadRequests();
        } else alert(res.message);
      } catch (err) { alert("Login failed."); }
    }

    async function loadAdminSettings() {
      const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "get_admin_settings" }) }).then(r=>r.json());
      if(res.success) {
        document.getElementById('set_active').checked = (res.active === "TRUE");
        document.getElementById('set_in_start').value = res.inStart; document.getElementById('set_in_end').value = res.inEnd;
        document.getElementById('set_out_start').value = res.outStart; document.getElementById('set_out_end').value = res.outEnd;
      }
    }
    async function saveAdminSettings() {
      const payload = { action: "update_admin_settings", active: document.getElementById('set_active').checked ? "TRUE" : "FALSE", inStart: document.getElementById('set_in_start').value, inEnd: document.getElementById('set_in_end').value, outStart: document.getElementById('set_out_start').value, outEnd: document.getElementById('set_out_end').value };
      const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) }).then(r=>r.json()); alert(res.message);
    }
    
    async function adminPunch(type) {
      const payload = { action: "admin_manual_punch", type: type, cfmsId: document.getElementById('manCfms').value, name: document.getElementById('manName').value, secretariat: document.getElementById('manSec').value };
      const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) }).then(r=>r.json()); alert(res.message);
    }

    async function createSubAdmin() {
      const payload = { action: "create_subadmin", newUsername: document.getElementById('subUser').value, newPassword: document.getElementById('subPass').value, newEmail: document.getElementById('subEmail').value };
      const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) }).then(r=>r.json()); alert(res.message);
    }

    async function loadRequests() {
      const container = document.getElementById('requestsContainer');
      const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "get_requests" }) }).then(r=>r.json());
      if (res.success && res.requests.length > 0) {
        container.innerHTML = res.requests.map(r => `
          <div class="p-3 bg-white border rounded-lg shadow-sm">
            <b class="text-indigo-900">${r.name} (${r.cfmsId})</b>
            <p class="mt-1 text-xs"><b>Requested:</b> <i>${r.request}</i></p>
            <div class="mt-2 space-y-1">
              <input type="text" id="editN_${r.rowIdx}" value="${r.name}" class="border p-1 w-full text-xs">
              <input type="text" id="editE_${r.rowIdx}" placeholder="New Email" class="border p-1 w-full text-xs">
              <input type="text" id="editP_${r.rowIdx}" placeholder="New Phone" class="border p-1 w-full text-xs">
              <button onclick="saveEdit(${r.rowIdx}, '${r.cfmsId}')" class="bg-indigo-600 text-white px-2 py-1 rounded w-full">Update DB & Resolve</button>
            </div>
          </div>`).join('');
      } else container.innerHTML = "<p class='text-slate-500'>No pending requests.</p>";
    }
    async function saveEdit(idx, cfms) {
      const payload = { action: "edit_employee", reqRowIdx: idx, cfmsId: cfms, newName: document.getElementById(`editN_${idx}`).value, newEmail: document.getElementById(`editE_${idx}`).value, newPhone: document.getElementById(`editP_${idx}`).value };
      const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) }).then(r=>r.json()); alert(res.message); loadRequests();
    }

    // --- EMPLOYEE ATTENDANCE LOGIC ---
    async function loginEmployee() {
      try {
        const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "emp_login", cfmsId: document.getElementById('empCfms').value, password: document.getElementById('empPass').value }) }).then(r=>r.json());
        if (res.success) {
          currentUser = res.user; hideAll(); document.getElementById('empCaptureView').classList.remove('hidden'); document.getElementById('logoutBtn').classList.remove('hidden'); document.getElementById('empWelcome').innerText = `${currentUser.name} (${currentUser.cfmsId})`;
          
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          document.getElementById('webcam').srcObject = stream; startAI();
        } else alert(res.message);
      } catch (err) { alert("Login error."); }
    }

    function startAI() {
      const videoElement = document.getElementById('webcam'), prompt = document.getElementById('aiPrompt');
      const faceMesh = new FaceMesh({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}` });
      faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
      let eyeClosed = false; livenessVerified = false;
      
      faceMesh.onResults(async (results) => {
        if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return prompt.innerText = "No Face Detected";
        const lm = results.multiFaceLandmarks[0];
        const avgEAR = ((Math.hypot(lm[159].x-lm[145].x, lm[159].y-lm[145].y)/Math.hypot(lm[33].x-lm[133].x, lm[33].y-lm[133].y)) + (Math.hypot(lm[386].x-lm[374].x, lm[386].y-lm[374].y)/Math.hypot(lm[362].x-lm[263].x, lm[362].y-lm[263].y)))/2;
        
        if (avgEAR < 0.16) eyeClosed = true;
        else if (avgEAR > 0.22 && eyeClosed && !livenessVerified) {
          livenessVerified = true; prompt.innerText = "Blink Verified! Matching Identity...";
          const detection = await faceapi.detectSingleFace(videoElement).withFaceLandmarks().withFaceDescriptor();
          
          // STRICT MATCH (Distance < 0.48 to prevent false positives and masks)
          if (detection && faceapi.euclideanDistance(detection.descriptor, new Float32Array(currentUser.faceDescriptor)) < 0.48) {
             prompt.innerText = "✅ Identity Verified! Select IN/OUT"; prompt.className = "absolute bottom-3 bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-full";
             const canvas = document.createElement('canvas'); canvas.width = 480; canvas.height = 480; const ctx = canvas.getContext('2d'); ctx.translate(480, 0); ctx.scale(-1, 1); ctx.drawImage(videoElement, 0, 0, 480, 480);
             capturedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.85);
             document.getElementById('btnIn').disabled = false; document.getElementById('btnOut').disabled = false;
          } else { 
             prompt.innerText = "❌ Face Mismatch or Mask Detected!"; prompt.className = "absolute bottom-3 bg-red-600 text-white text-xs px-3 py-1.5 rounded-full"; 
             livenessVerified = false; eyeClosed = false; 
          }
        } else if (!livenessVerified) prompt.innerText = "Please Blink to Verify Liveness";
      });
      cameraInstance = new Camera(videoElement, { onFrame: async () => { await faceMesh.send({ image: videoElement }); }, width: 480, height: 480 });
      cameraInstance.start();
    }

    async function punchAttendance(type) {
      if (!livenessVerified || !capturedPhotoBase64) return;
      const btn = type === 'IN' ? document.getElementById('btnIn') : document.getElementById('btnOut');
      const txt = btn.innerText; btn.innerText = "Submitting..."; btn.disabled = true;
      try {
        const payload = { action: "mark_attendance", type: type, cfmsId: currentUser.cfmsId, name: currentUser.name, secretariat: currentUser.secretariat, photoBase64: capturedPhotoBase64 };
        const res = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) }).then(r=>r.json());
        if (res.success) { alert(res.message); logout(); } else { alert(res.message); btn.innerText = txt; btn.disabled = false; }
      } catch (err) { alert("Network error."); btn.innerText = txt; btn.disabled = false;}
    }
  </script>
</body>
</html>
