<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Face Attendance System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- MediaPipe FaceMesh (Liveness / Blinking) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  
  <!-- Face-API.js (Face Recognition & Matching) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>

  <style>.glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }</style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col justify-between">

  <header class="bg-indigo-700 text-white p-4 shadow-md text-center font-bold text-lg flex justify-between items-center">
    <span>AI Attendance Hub</span>
    <button id="logoutBtn" onclick="logout()" class="hidden text-xs bg-red-500 px-3 py-1.5 rounded-lg">Logout</button>
  </header>

  <main class="container mx-auto p-4 max-w-md flex-1">

    <!-- 0. ROLE SELECTOR -->
    <div id="roleView" class="glass p-6 rounded-2xl shadow-xl mt-8 text-center space-y-4">
      <h2 class="text-xl font-bold text-indigo-900">Select Portal</h2>
      <button onclick="showRegistration()" class="w-full py-3 bg-amber-500 text-white font-semibold rounded-xl shadow-md">Employee Self Registration</button>
      <button onclick="showEmpLogin()" class="w-full py-3 bg-emerald-600 text-white font-semibold rounded-xl shadow-md">Mark Face Attendance</button>
      <button onclick="showAdminLogin()" class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl shadow-md">Admin / Requests Portal</button>
    </div>

    <!-- 1. SELF REGISTRATION VIEW -->
    <div id="registrationView" class="hidden glass p-6 rounded-2xl shadow-xl mt-4 space-y-4">
      <h2 class="text-xl font-bold text-amber-700">Self Registration</h2>
      
      <div class="flex gap-2">
        <input type="text" id="regSecNo" placeholder="Enter Secretariat No" class="w-full p-2 border rounded-lg">
        <button onclick="fetchEmpData()" class="bg-amber-500 text-white px-4 rounded-lg font-bold">Fetch</button>
      </div>

      <div id="regDetails" class="hidden space-y-2 text-sm">
        <input type="text" id="r_secName" readonly class="w-full p-2 bg-slate-100 rounded" placeholder="Secretariat Name">
        <input type="text" id="r_postName" readonly class="w-full p-2 bg-slate-100 rounded" placeholder="Post Name">
        <input type="text" id="r_candName" readonly class="w-full p-2 bg-slate-100 rounded" placeholder="Candidate Name">
        <input type="text" id="r_cfms" readonly class="w-full p-2 bg-slate-100 rounded" placeholder="CFMS ID">
        <input type="text" id="r_phone" readonly class="w-full p-2 bg-slate-100 rounded" placeholder="Phone No">
        
        <textarea id="r_request" placeholder="Employee Request: Describe any corrections needed for the above data..." class="w-full p-2 border rounded-lg mt-2 h-16"></textarea>
        
        <div class="relative w-full aspect-square bg-black rounded-xl overflow-hidden mt-2 flex items-center justify-center">
          <video id="regWebcam" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
          <div id="regPrompt" class="absolute bottom-2 bg-black/70 text-white text-xs px-2 py-1 rounded">Align face for Registration</div>
        </div>

        <button onclick="registerWithFace()" class="w-full py-3 bg-amber-600 text-white font-bold rounded-xl mt-2">Capture Face & Register</button>
      </div>
      <button onclick="showHome()" class="w-full text-slate-500 text-sm">Back to Home</button>
    </div>

    <!-- 2. ADMIN PORTAL (With Requests) -->
    <div id="adminLoginView" class="hidden glass p-6 rounded-2xl shadow-xl mt-4 space-y-4">
      <input type="text" id="adminUser" placeholder="Username (admin)" class="w-full p-3 border rounded-xl">
      <input type="password" id="adminPass" placeholder="Password" class="w-full p-3 border rounded-xl">
      <button onclick="loginAdmin()" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl">Login</button>
      <button onclick="showHome()" class="w-full text-slate-500 text-sm">Back</button>
    </div>

    <div id="adminDashboardView" class="hidden space-y-4">
      <div class="glass p-5 rounded-2xl shadow space-y-3">
        <h3 class="font-bold text-indigo-900 border-b pb-2">Pending Employee Data Requests</h3>
        <button onclick="loadRequests()" class="w-full py-2 bg-slate-200 rounded-lg text-sm mb-2">Refresh Requests</button>
        <div id="requestsContainer" class="space-y-2 text-sm max-h-64 overflow-y-auto"></div>
      </div>
    </div>

    <!-- 3. EMPLOYEE ATTENDANCE MODULE (Kept similar, updated JS) -->
    <div id="empLoginView" class="hidden glass p-6 rounded-2xl shadow-xl mt-4 space-y-4">
      <input type="text" id="empCfms" placeholder="CFMS ID" class="w-full p-3 border rounded-xl">
      <input type="password" id="empPass" placeholder="Default: Emp@123" class="w-full p-3 border rounded-xl">
      <button onclick="loginEmployee()" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl">Login for Attendance</button>
      <button onclick="showHome()" class="w-full text-slate-500 text-sm">Back</button>
    </div>

    <div id="empCaptureView" class="hidden space-y-4">
      <div class="glass p-4 rounded-2xl shadow text-center space-y-2">
        <h3 id="empWelcome" class="font-bold text-lg text-emerald-900"></h3>
        <p id="geoStatus" class="text-xs font-semibold text-slate-600">Verifying GPS...</p>
      </div>
      <div class="relative w-full aspect-square bg-black rounded-2xl overflow-hidden shadow-2xl flex items-center justify-center">
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
        <div id="aiPrompt" class="absolute bottom-3 bg-black/75 text-white text-xs px-3 py-1.5 rounded-full">Initializing AI Engines...</div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button id="btnIn" onclick="punchAttendance('IN')" disabled class="py-3 bg-emerald-600 disabled:bg-slate-400 text-white font-bold rounded-xl shadow">Punch IN</button>
        <button id="btnOut" onclick="punchAttendance('OUT')" disabled class="py-3 bg-red-600 disabled:bg-slate-400 text-white font-bold rounded-xl shadow">Punch OUT</button>
      </div>
    </div>

  </main>

  <script>
    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

    let currentUser = null, cameraInstance = null, regCameraInstance = null;
    let modelsLoaded = false, livenessVerified = false, faceMatched = false;
    let currentCoords = { lat: 0, lng: 0 };
    let capturedPhotoBase64 = null;

    // Load FaceAPI Models securely from CDN
    async function initFaceAPI() {
      if(modelsLoaded) return;
      document.getElementById('aiPrompt').innerText = "Downloading Face Models (Once)...";
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await Promise.all([
        faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);
      modelsLoaded = true;
      document.getElementById('aiPrompt').innerText = "AI Models Loaded";
    }

    // Nav Helpers
    function hideAll() {
      ['roleView','registrationView','adminLoginView','adminDashboardView','empLoginView','empCaptureView'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById('logoutBtn').classList.add('hidden');
    }
    function showHome() { hideAll(); document.getElementById('roleView').classList.remove('hidden'); }
    function showAdminLogin() { hideAll(); document.getElementById('adminLoginView').classList.remove('hidden'); }
    function showEmpLogin() { hideAll(); document.getElementById('empLoginView').classList.remove('hidden'); initFaceAPI(); }
    
    // REGISTRATION LOGIC
    function showRegistration() {
      hideAll(); document.getElementById('registrationView').classList.remove('hidden'); initFaceAPI();
    }

    async function fetchEmpData() {
      const secNo = document.getElementById('regSecNo').value;
      if(!secNo) return alert("Enter Secretariat No");
      const res = await (await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "fetch_emp_data", secretariatNo: secNo }) })).json();
      
      if(res.success) {
        document.getElementById('regDetails').classList.remove('hidden');
        document.getElementById('r_secName').value = res.data.secName;
        document.getElementById('r_postName').value = res.data.postName;
        document.getElementById('r_candName').value = res.data.candidateName;
        document.getElementById('r_cfms').value = res.data.cfmsId;
        document.getElementById('r_phone').value = res.data.phone;
        
        // Start Registration Camera
        const videoElement = document.getElementById('regWebcam');
        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => { videoElement.srcObject = stream; });
      } else { alert(res.message); }
    }

    async function registerWithFace() {
      const video = document.getElementById('regWebcam');
      document.getElementById('regPrompt').innerText = "Scanning Face...";
      
      const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
      if(!detection) return alert("No face detected! Please look at the camera in good lighting.");
      
      const payload = {
        action: "self_register",
        secName: document.getElementById('r_secName').value,
        candidateName: document.getElementById('r_candName').value,
        cfmsId: document.getElementById('r_cfms').value,
        phone: document.getElementById('r_phone').value,
        empRequest: document.getElementById('r_request').value,
        faceDescriptor: Array.from(detection.descriptor) // Convert Float32Array to standard array for JSON
      };

      const res = await (await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) })).json();
      if(res.success) {
        // Show Message Box as requested
        alert(`🎉 Registration Successful!\n\nCandidate: ${payload.candidateName}\nCFMS ID: ${payload.cfmsId}\n\nYou can now log in to mark attendance.`);
        showHome();
      }
    }

    // ADMIN REQUEST LOGIC
    async function loginAdmin() {
       // Code to login admin and show adminDashboardView... (same as previous)
       hideAll(); document.getElementById('adminDashboardView').classList.remove('hidden');
       loadRequests();
    }
    
    async function loadRequests() {
      const res = await (await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "get_requests" }) })).json();
      const container = document.getElementById('requestsContainer');
      if(res.success && res.requests.length > 0) {
        container.innerHTML = res.requests.map(r => `
          <div class="p-3 bg-slate-50 border rounded-lg shadow-sm">
            <b>${r.name} (${r.cfmsId})</b>
            <p class="text-slate-600 mt-1">Requested Change: <i>${r.request}</i></p>
            <button onclick="resolveRequest(${r.rowIdx})" class="mt-2 text-xs bg-indigo-500 text-white px-2 py-1 rounded">Mark as Handled & Update DB</button>
          </div>
        `).join('');
      } else { container.innerHTML = "<p>No pending requests.</p>"; }
    }
    async function resolveRequest(idx) {
      await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "resolve_request", rowIdx: idx }) });
      loadRequests();
    }

    // ATTENDANCE & FACE MATCHING LOGIC
    async function loginEmployee() {
      const res = await (await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "emp_login", cfmsId: document.getElementById('empCfms').value, password: document.getElementById('empPass').value }) })).json();
      if (res.success) {
        currentUser = res.user;
        hideAll(); document.getElementById('empCaptureView').classList.remove('hidden');
        document.getElementById('empWelcome').innerText = `${currentUser.name} (${currentUser.cfmsId})`;
        
        // Skip Geofence logic for brevity in this snippet, assuming it passes:
        document.getElementById('geoStatus').innerText = "Location Verified"; 
        startAI();
      } else alert(res.message);
    }

    function startAI() {
      const videoElement = document.getElementById('webcam');
      const prompt = document.getElementById('aiPrompt');
      
      const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
      faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true });
      
      let eyeClosed = false;
      
      faceMesh.onResults(async (results) => {
        if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return prompt.innerText = "No Face Detected";
        
        // Liveness (Blink Detection) logic from previous step
        const lm = results.multiFaceLandmarks[0];
        const avgEAR = ((Math.hypot(lm[159].x-lm[145].x, lm[159].y-lm[145].y) / Math.hypot(lm[33].x-lm[133].x, lm[33].y-lm[133].y)) + 
                        (Math.hypot(lm[386].x-lm[374].x, lm[386].y-lm[374].y) / Math.hypot(lm[362].x-lm[263].x, lm[362].y-lm[263].y))) / 2;
        
        if (avgEAR < 0.16) eyeClosed = true;
        else if (avgEAR > 0.22 && eyeClosed && !livenessVerified) {
          livenessVerified = true;
          prompt.innerText = "Blink Verified! Matching Face ID...";
          
          // BLINK PASSED -> NOW DO FACE RECOGNITION MATCHING
          const detection = await faceapi.detectSingleFace(videoElement).withFaceLandmarks().withFaceDescriptor();
          if(detection) {
             const registeredDescriptor = new Float32Array(currentUser.faceDescriptor);
             const distance = faceapi.euclideanDistance(detection.descriptor, registeredDescriptor);
             
             if(distance < 0.55) { // 0.55 is standard threshold for match
                prompt.innerText = "Face Matched! Ready to Punch";
                prompt.className = "absolute bottom-3 bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-full font-semibold";
                
                // Snap photo for logs
                const canvas = document.createElement('canvas'); canvas.width=480; canvas.height=480;
                const ctx = canvas.getContext('2d'); ctx.translate(480, 0); ctx.scale(-1, 1);
                ctx.drawImage(videoElement, 0, 0, 480, 480);
                capturedPhotoBase64 = canvas.toDataURL('image/jpeg');

                document.getElementById('btnIn').disabled = false; document.getElementById('btnOut').disabled = false;
             } else {
                prompt.innerText = "❌ Face Does Not Match Registration!";
                prompt.className = "absolute bottom-3 bg-red-600 text-white text-xs px-3 py-1.5 rounded-full font-semibold";
                livenessVerified = false; eyeClosed = false; // Reset to try again
             }
          }
        }
      });

      cameraInstance = new Camera(videoElement, { onFrame: async () => { await faceMesh.send({ image: videoElement }); }, width: 480, height: 480 });
      cameraInstance.start();
    }

    async function punchAttendance(type) {
        // [Existing Punch Logic to send data to backend...]
        alert(`Success: ${type} Recorded for ${currentUser.name}`);
        showHome();
    }
  </script>
</body>
</html>
